"$schema" = "https://starship.rs/config-schema.json"
# Powerline blocks, input on the second line. Colors are ANSI names, so they follow the kitty (wallpaper) palette.
format = """
[](blue)\
$username$hostname\
[](fg:blue bg:white)\
$directory\
[](fg:white bg:bright-black)\
$git_branch$git_status\
[ ](fg:bright-black)\
$python$nodejs$rust$cmd_duration\
$line_break\
$sudo$status$character"""
add_newline = true

[username]
show_always = false          # only over SSH or as root
style_user = "bg:blue fg:black bold"
style_root = "bg:blue fg:red bold"
format = "[$user@]($style)"

[hostname]
ssh_only = false
ssh_symbol = " "
style = "bg:blue fg:black bold"
format = "[$ssh_symbol$hostname ]($style)"

[directory]
style = "bg:white fg:black"
format = "[ $path ]($style)[$read_only]($read_only_style)"
read_only = " "
read_only_style = "bg:white fg:red"
truncation_length = 3
truncate_to_repo = false

[git_branch]
symbol = "󰘬 "
style = "bg:bright-black fg:black"
format = "[ $symbol$branch ]($style)"

[git_status]
style = "bg:bright-black fg:black"
format = "[($all_status$ahead_behind )]($style)"

[python]
symbol = " "
style = "bright-black"
format = '[$symbol$version( \($virtualenv\)) ]($style)'

[nodejs]
symbol = " "
style = "bright-black"
format = "[$symbol$version ]($style)"

[rust]
symbol = " "
style = "bright-black"
format = "[$symbol$version ]($style)"

[cmd_duration]
min_time = 2000
style = "bright-black"
format = "[took $duration]($style) "

[sudo]
disabled = false
symbol = "󰌾 "
style = "bold red"
format = "[$symbol]($style)"

[status]
disabled = false
symbol = "✘ "
style = "red"
format = "[$symbol$status]($style) "

[character]
success_symbol = "[❯](white)"
error_symbol = "[❯](bold red)"
vimcmd_symbol = "[❮](white)"
