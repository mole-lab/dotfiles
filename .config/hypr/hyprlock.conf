# Lock screen matched to the SilentSDDM "tomie-a" layout
$font = JetBrainsMono Nerd Font

general {
    hide_cursor = true
}

background {
    monitor =
    path = ~/Pictures/lock/background.jpg
    blur_passes = 0
    brightness = 0.85
}

image {
    monitor =
    path = ~/Pictures/lock/avatar.png
    size = 100
    rounding = 0
    border_size = 1
    border_color = rgb(8B0000)
    position = 0, 180
    halign = center
    valign = bottom
}

label {
    monitor =
    text = $USER
    font_family = $font
    font_size = 16
    color = rgb(BDBDBD)
    position = 0, 144
    halign = center
    valign = bottom
}

input-field {
    monitor =
    size = 280, 36
    outline_thickness = 1
    rounding = 0
    inner_color = rgba(000000b3)
    outer_color = rgb(8B0000)
    check_color = rgb(B3001B)
    fail_color = rgb(B3001B)
    font_color = rgb(E6E6E6)
    font_family = $font
    fade_on_empty = false
    placeholder_text =
    fail_text = access denied
    dots_size = 0.25
    dots_spacing = 0.3
    position = 0, 96
    halign = center
    valign = bottom
}
