general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    # turn the screens back on after waking from suspend
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
}

# 5 min: lock
listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

# 5 min 30 s: screens off (any key or mouse move turns them back on)
listener {
    timeout = 330
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "disable" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
}

# 15 min: suspend, on battery only (never while charging / docked to the monitor).
# condition_retry re-checks every 60 s, so unplugging while idle still suspends.
listener {
    timeout = 900
    condition_cmd = test "$(cat /sys/class/power_supply/AC/online)" = 0
    condition_retry = 60
    on-timeout = systemctl suspend
}
