[General]
animated-background-placeholder = "tomie-login.jpg"
background-fill-mode = "fill"

[LockScreen]
display = false

[LoginScreen]
background = "tomie-login.mp4"
blur = 0
brightness = -0.15
saturation = 0.0

[LoginScreen.LoginArea.Spinner]
text = "verifying identity"
font-family = "JetBrainsMono Nerd Font"
color = "#E6E6E6"

[LoginScreen.LoginArea.WarningMessage]
font-family = "JetBrainsMono Nerd Font"
normal-color = "#BDBDBD"
warning-color = "#B3001B"
error-color = "#B3001B"
margin-top = 10

[LoginScreen.MenuArea.Buttons]
font-family = "JetBrainsMono Nerd Font"

[LoginScreen.MenuArea.Layout]
display = false

[LoginScreen.MenuArea.Keyboard]
display = false

[Tooltips]
font-family = "JetBrainsMono Nerd Font"
background-color = "#000000"
background-opacity = 0.7
border-radius = 0

[LoginScreen.LoginArea]
position = "center"
margin = 800

[LoginScreen.LoginArea.Avatar]
shape = "square"
border-radius = 0
active-size = 100
active-border-size = 1
active-border-color = "#8B0000"

[LoginScreen.LoginArea.Username]
font-family = "JetBrainsMono Nerd Font"
font-size = 16
font-weight = 600
color = "#BDBDBD"
margin = 14

[LoginScreen.LoginArea.PasswordInput]
width = 280
height = 36
font-family = "JetBrainsMono Nerd Font"
font-size = 16
content-color = "#E6E6E6"
background-color = "#000000"
background-opacity = 0.7
border-size = 1
border-color = "#8B0000"
border-radius-left = 0
border-radius-right = 0
margin-top = 10
masked-character = "*"

[LoginScreen.LoginArea.LoginButton]
hide-if-not-needed = true
